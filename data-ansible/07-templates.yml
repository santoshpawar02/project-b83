# Template use cases in Ansible include generating configuration files, scripts, or any other text-based files that require dynamic content based on variables or facts. 
# Templates allow you to create reusable and customizable files that can be deployed across multiple hosts or environments.
# Important points about templates in Ansible:
# 1. Templates are created using the Jinja2 templating engine, which allows you to use variables, loops, conditionals, and filters to generate dynamic content.
# 2. Templates are typically stored in the `templates` directory of a role or playbook, and they can be referenced using the `template` module in Ansible tasks.
# 3. Templates can be used to generate configuration files for various applications, such as web servers, databases, or any other software that requires configuration files.
# 4. Templates can also be used to generate scripts or any other text-based files that require dynamic content based on variables or facts.
# 5. Templates can be used to create reusable and customizable files that can be deployed across multiple hosts or environments, making it easier to manage and maintain configurations in a consistent manner.   
# Example of using a template in Ansible to generate a configuration file:
- name: Template Example
  hosts: localhost
  vars:
    app_name: "MyApp"
    app_port: 8080
  tasks:
    - name: Generate configuration file from template
      template:
        src: templates/config.j2
        dest: /tmp/config.conf
# The above example demonstrates how to use a template in Ansible to generate a configuration file. The `template` module is used to specify the source template file (`src`) and 
# the destination file (`dest`) where the generated content will be saved. The variables `app_name` and `app_port` are used in the template to dynamically generate the content of the configuration file based on their values.    


# Similarly, you can use templates to generate scripts or any other text-based files that require dynamic content based on variables or facts.
# Example of using a template in Ansible to generate a script:
- name: Template Example for Script Generation
  hosts: localhost
  vars:
    script_name: "myscript.sh"
    script_content: |
      #!/bin/bash
      echo "Hello, Ansible!"
  tasks:
    - name: Generate script from template
      template:
        src: templates/script.j2
        dest: /tmp/{{ script_name }}
# The above example demonstrates how to use a template in Ansible to generate a script. The `template` module is used to specify the source template file (`src`) and the destination file (`dest`) where the generated content will be saved. The variables `script_name` and `script_content` are used in the template to dynamically generate the content of the script based on their values. 

# Some examples of template use cases in Ansible include generating configuration files for web servers, databases, or any other software 
# that requires configuration files, generating scripts for automation tasks, generating documentation or reports based on dynamic data,
# and generating any other text-based files that require dynamic content based on variables or facts.
# Below is an example of using a template in Ansible to generate a configuration file for a web server:
- name: Template Example for Web Server Configuration
  hosts: localhost
  vars:
    server_name: "example.com"
    document_root: "/var/www/html"
  tasks:
    - name: Generate web server configuration file from template
      template:
        src: templates/webserver.conf.j2
        dest: /etc/httpd/conf.d/webserver.conf
# The above example demonstrates how to use a template in Ansible to generate a configuration file for a web server. The `template` module is used to specify the source template file (`src`) and the destination file (`dest`) where the generated content will be saved. The variables `server_name` and `document_root` are used in the template to dynamically generate the content of the configuration file based on their values.        


