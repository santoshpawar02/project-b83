# Conditons in Ansible allow you to control the execution of tasks based on certain criteria. 
# You can use conditions to determine whether a task should run or be skipped, 
#  depending on the values of variables, facts, or other conditions.


# Below are some examples of conditions in Ansible:
- name: Run a task only if a variable is defined
  hosts: localhost
  vars:
    my_variable: "Hello, Ansible!"
  tasks:
    - name: Print a message if my_variable is defined
      debug:
        msg: "{{ my_variable }}"
      when: my_variable is defined

- name: Run a task only if a variable is not defined
  hosts: localhost
  tasks:
    - name: Print a message if my_variable is not defined
      debug:
        msg: "my_variable is not defined"
      when: my_variable is not defined

- name: Run a task only if a variable is equal to a specific value
  hosts: localhost
  vars:
    my_variable: "Hello, Ansible!"
  tasks:
    - name: Print a message if my_variable is equal to "Hello, Ansible!"
      debug:
        msg: "my_variable is equal to 'Hello, Ansible!'"
      when: my_variable == "Hello, Ansible!"

- name: Condition demo
  hosts: localhost
  vars:
    my_variable: "Hello, Ansible!"
  tasks:
    - name: Print a message if my_variable is equal to "Hello, Ansible!"
      debug:
        msg: "my_variable is equal to 'Hello, Ansible!'"
      when: my_variable == "Hello, Ansible!"

    - name: Print a message if my_variable is not equal to "Goodbye, Ansible!"
      debug:
        msg: "my_variable is not equal to 'Goodbye, Ansible!'"
      when: my_variable != "Goodbye, Ansible!"

    - name: Print a message if my_variable is in a list of values
      debug:
        msg: "my_variable is in the list of values"
      when: my_variable in ["Hello, Ansible!", "Hi, Ansible!"]

    - name: Print a message if my_variable is not in a list of values
      debug:
        msg: "my_variable is not in the list of values"
      when: my_variable not in ["Goodbye, Ansible!", "Bye, Ansible!"]


- name: Condition demo
  hosts: localhost
  tasks:
  - name: X is greater than 10
    debug:
      msg: "X is greater than 10"
    when: x > 10
    - name: X is less than or equal to 10 
    debug:
